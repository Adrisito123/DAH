<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Hola, {{ nombre }}</ion-title>

    <ion-buttons slot="end">
      <ion-button [routerLink]="['/settings']">
        <ion-icon name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar color="primary">
    <ion-searchbar (ionInput)="buscar($event)" placeholder="Buscar..."></ion-searchbar>
  </ion-toolbar>

  <ion-item>
    <ion-label>Ordenar:</ion-label>
    <ion-select [value]="campoOrden + '_' + sentidoOrden" (ionChange)="cambiarOrden($event)">
      <ion-select-option value="id_desc">Recientes</ion-select-option>
      <ion-select-option value="titulo_asc">A-Z</ion-select-option>
    </ion-select>
  </ion-item>
</ion-header>

<ion-content>

  <ion-card *ngIf="mostrarFormulario">
    <ion-card-header>
      <ion-card-title>Nueva Noticia</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-input [(ngModel)]="nuevaNoticia.titulo" placeholder="Título"></ion-input>
      </ion-item>

      <ion-item>
        <ion-textarea [(ngModel)]="nuevaNoticia.resumen" placeholder="Resumen"></ion-textarea>
      </ion-item>

      <ion-item>
        <ion-input [(ngModel)]="nuevaNoticia.autor" placeholder="Autor"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input [(ngModel)]="nuevaNoticia.imagenUrl" placeholder="URL Imagen"></ion-input>
      </ion-item>

      <ion-button expand="block" (click)="agregarNoticia()">
        Publicar
      </ion-button>
    </ion-card-content>
  </ion-card>

  <ion-grid>
    <ion-row>
      
      <ng-container *ngIf="cargando">
        <ion-col size="6" size-sm="4" size-md="3" size-lg="2" *ngFor="let item of [1,2,3,4,5,6,7,8]">
          <ion-card style="height: 320px; margin: 0; background: #1e1e1e;">
            <ion-skeleton-text animated style="width: 100%; height: 120px; margin: 0;"></ion-skeleton-text>
            <div style="padding: 10px;">
              <ion-skeleton-text animated style="width: 40%; height: 12px; margin-bottom: 10px;"></ion-skeleton-text>
              <ion-skeleton-text animated style="width: 90%; height: 18px;"></ion-skeleton-text>
              <ion-skeleton-text animated style="width: 100%; height: 10px; margin-top: 15px;"></ion-skeleton-text>
              <ion-skeleton-text animated style="width: 80%; height: 10px;"></ion-skeleton-text>
              <ion-skeleton-text animated style="width: 100%; height: 32px; margin-top: 20px; border-radius: 6px;"></ion-skeleton-text>
            </div>
          </ion-card>
        </ion-col>
      </ng-container>

      <ng-container *ngIf="!cargando">
        <ion-col size="6" size-sm="4" size-md="3" size-lg="2" *ngFor="let n of noticias; trackBy: trackById">
          <app-task-item [noticia]="n" (eliminar)="eliminarNoticia(n)"></app-task-item>
        </ion-col>

        <ion-col size="12" *ngIf="noticias.length === 0" class="ion-text-center">
          <p style="color: #aaa; margin-top: 50px;">No se encontraron noticias.</p>
        </ion-col>
      </ng-container>

    </ion-row>
  </ion-grid>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="toggleFormulario()">
      <ion-icon [name]="mostrarFormulario ? 'close' : 'add'"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
