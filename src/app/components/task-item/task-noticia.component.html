<ion-card class="noticia-card">
  <div class="imagen-wrapper">
    <img [src]="noticia.imagenUrl" />
  </div>

  <div class="contenido-noticia">
    <div class="autor-text">{{ noticia.autor }}</div>
    
    <div class="titulo-limitado">
      {{ noticia.titulo }}
    </div>

    <p class="resumen-limitado">
      {{ noticia.resumen }}
    </p>

    <div class="cuerpo-inferior">
      <ion-row class="ion-align-items-center">
        <ion-col size="9">
          <ion-button expand="block" size="small" class="boton-leer" [routerLink]="['/detalle-noticia', noticia.id]">
            LEER MÁS
          </ion-button>
        </ion-col>
        <ion-col size="3" class="ion-text-right">
          <ion-button fill="clear" color="danger" (click)="onEliminar()">
            <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-col>
      </ion-row>
    </div>
  </div>
</ion-card>
